name: Production Playwright Audit

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production or preview URL to audit
        required: true
        default: https://bufferblaster.netlify.app

jobs:
  public-browser-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buffer-blaster-playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
