name: Temporary locked Next.js security refresh
on:
  push:
    branches: [fix/buffer-next-critical-security]
    paths:
      - .github/workflows/security-next-lock-refresh.yml
permissions:
  contents: write
jobs:
  fix-lockfile:
    if: github.repository == 'executiveusa/buffer-blaster-'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/buffer-next-critical-security
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile with exact patched versions
        working-directory: frontend
        run: |
          npm install next@16.4.6 eslint-config-next@16.4.6 --save-exact --package-lock-only --ignore-scripts
      - name: Commit only dependency manifests to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --quiet && exit 1
          git commit -m "fix(security): pin patched Next and ESLint config with generated lockfile"
          git push origin HEAD:fix/buffer-next-critical-security
      - name: Install exact lockfile
        working-directory: frontend
        run: npm ci
      - name: Confirm no high/critical production advisories
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Frontend lint and build
        working-directory: frontend
        run: |
          npm run lint
          npm run build
