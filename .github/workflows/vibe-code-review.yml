name: Vibe Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  models: read

jobs:
  review:
    if: github.event.pull_request.draft == false
    # Pin the independently reviewed OpenCodeReview standard rather than floating main.
    uses: executiveusa/open-code-review/.github/workflows/vibe-review-standard.yml@c8e4c02b6f0e9467b755fc7e24b2619f6854a6a4
