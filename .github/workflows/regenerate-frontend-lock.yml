name: Regenerate frontend lockfile (temporary)

on:
  push:
    branches:
      - feat/ci-production-proof

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate package lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lock when changed
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: regenerate frontend lockfile"
          git push origin HEAD:feat/ci-production-proof
