name: Refresh Rust lockfile

on:
  push:
    branches:
      - fix/mcp-rate-limit-rust-core-2026-10-11
    paths:
      - ".github/workflows/rust-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mcp-rate-limit-rust-core-2026-10-11
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate lockfile and prove locked build
        working-directory: rust_core/stavarai_core
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile
          cargo test --locked
      - name: Commit generated lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust_core/stavarai_core/Cargo.lock
          git rm .github/workflows/rust-lock-refresh.yml
          git commit -m "build(rust): regenerate lockfile after entropy dependency change"
          git push origin HEAD:fix/mcp-rate-limit-rust-core-2026-10-11
