name: Frontend Verify

on:
  pull_request:
    paths:
      - "frontend/**"
      - "netlify.toml"
      - ".github/workflows/frontend-verify.yml"
  push:
    branches:
      - "feat/proof-first-landing-gauntlet-2026-09-19"
    paths:
      - "frontend/**"
      - "netlify.toml"
      - ".github/workflows/frontend-verify.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run gauntlet
      - run: npm run build
