name: Refresh frontend security lockfile

on:
  push:
    branches:
      - security/frontend-audit-2026-10-11
    paths:
      - ".github/workflows/security-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/frontend-audit-2026-10-11
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh only the security-sensitive frontend versions
        working-directory: frontend
        run: |
          npm pkg set dependencies.next=16.4.0
          npm pkg set devDependencies.eslint-config-next=16.4.0
          npm pkg set overrides.sharp=0.35.5
          npm pkg set overrides.source-map-js=1.2.2
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit generated lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git rm .github/workflows/security-lock-refresh.yml
          git commit -m "fix(frontend): clear production dependency audit"
          git push origin HEAD:security/frontend-audit-2026-10-11
