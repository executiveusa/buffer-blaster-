name: Test API and Frontend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    name: Python API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Run Python tests
        run: python -m pytest tests -q
      - name: Compile verified creator corpus
        run: python scripts/build_creator_catalog.py --input library/imported/youmind --output /tmp/creator-catalog

  schema-proof:
    name: Fresh PostgreSQL schema proof
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buffer_blaster_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Create Supabase storage contract stub
        run: |
          psql -h 127.0.0.1 -U postgres -d buffer_blaster_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE TABLE IF NOT EXISTS storage.buckets (
            id text PRIMARY KEY,
            name text NOT NULL,
            public boolean NOT NULL DEFAULT false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          SQL
      - name: Apply canonical Buffer Blaster migrations twice
        run: |
          for pass in 1 2; do
            echo "Schema pass $pass"
            for migration in \
              supabase/migrations/007_buffer_blaster_schema.sql \
              supabase/migrations/008_buffer_blaster_beta_scale.sql \
              supabase/migrations/009_buffer_blaster_storage.sql \
              supabase/migrations/010_buffer_blaster_default_workspace.sql; do
              psql -h 127.0.0.1 -U postgres -d buffer_blaster_ci -v ON_ERROR_STOP=1 -f "$migration"
            done
          done
      - name: Verify canonical tables workspace RLS and private bucket
        run: |
          test "$(psql -h 127.0.0.1 -U postgres -d buffer_blaster_ci -Atc "select count(*) from buffer_blaster.workspaces where id='00000000-0000-0000-0000-000000000001'::uuid")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d buffer_blaster_ci -Atc "select count(*) from information_schema.tables where table_schema='buffer_blaster' and table_name in ('creative_jobs','usage_wallets','checkout_receipts','performance_events','source_assets')")" = "5"
          test "$(psql -h 127.0.0.1 -U postgres -d buffer_blaster_ci -Atc "select relrowsecurity from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='buffer_blaster' and c.relname='creative_jobs'")" = "t"
          test "$(psql -h 127.0.0.1 -U postgres -d buffer_blaster_ci -Atc "select public from storage.buckets where id='buffer-blaster-assets'")" = "f"

  selfhost-package:
    name: Self-host container and compose proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose
        run: |
          cp .env.production.example .env.production
          docker compose -f docker-compose.prod.yml config > /tmp/stavarai-compose.yml
      - name: Build production API image
        run: docker build -t stavarai-api:ci .
      - name: Smoke production API image
        run: |
          docker run -d --name stavarai-api-ci \
            -p 127.0.0.1:18000:8000 \
            -e MASTER_ENCRYPTION_KEY=ci-only-key \
            -e DEMO_PASSWORD=ci-only-password \
            -e BLASTER_API_KEY=ci-only-api-key \
            -e WEB_CONCURRENCY=1 \
            stavarai-api:ci
          trap 'docker rm -f stavarai-api-ci >/dev/null 2>&1 || true' EXIT
          READY=0
          for attempt in {1..30}; do
            if [[ "$(docker inspect -f '{{.State.Running}}' stavarai-api-ci 2>/dev/null || true)" != "true" ]]; then
              echo "Container exited during startup"
              docker logs stavarai-api-ci || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:18000/api/health > /tmp/stavarai-health.json; then
              READY=1
              break
            fi
            sleep 1
          done
          if [[ "$READY" != "1" ]]; then
            echo "API did not become healthy"
            docker logs stavarai-api-ci || true
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/stavarai-health.json
          grep -q '"approval_gate":true' /tmp/stavarai-health.json
          STATUS=$(curl -fsS -H 'x-api-key: ci-only-api-key' http://127.0.0.1:18000/api/studio/status)
          echo "$STATUS" | grep -q '"approval_gate":true'
          echo "$STATUS" | grep -q '"provider":null'
          echo "$STATUS" | grep -q '"enabled":false'
          echo "$STATUS" | grep -q '"required_for_core":false'
          PRICING=$(curl -fsS -H 'x-api-key: ci-only-api-key' http://127.0.0.1:18000/api/studio/pricing)
          echo "$PRICING" | grep -q '"trial-7"'
          echo "$PRICING" | grep -q '"price_cents":1900'
          echo "$PRICING" | grep -q '"fees_overhead_research_and_refund_reserves_are_protected_before_provider_spend":true'
          RAW_RENDER=$(curl -fsS -X POST -H 'x-api-key: ci-only-api-key' -H 'Content-Type: application/json' http://127.0.0.1:18000/api/studio/ugc/render --data '{"idea":"test"}')
          echo "$RAW_RENDER" | grep -q '"error":"guarded_factory_required"'

  frontend-build:
    name: Frontend security, gauntlet, lint, build, and route smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Block high-severity production vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Block critical vulnerabilities in full tree
        run: npm audit --audit-level=critical
      - name: Test dependency-free frontmatter parser
        run: npm run test:frontmatter
      - name: Run structural design gauntlet
        run: npm run gauntlet
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build > /tmp/frontend-build.log 2>&1
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-diagnostics
          path: /tmp/frontend-build.log
      - name: Smoke public, studio, checkout, trial, creator, and export routes
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/social-studio-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for attempt in {1..30}; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Next server exited during startup"
              cat /tmp/social-studio-next.log || true
              exit 1
            fi
            if curl -fsS --retry 2 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [[ "$READY" != "1" ]]; then
            echo "Next server did not become ready"
            cat /tmp/social-studio-next.log || true
            exit 1
          fi

          get() { curl -fsS --retry 5 --retry-connrefused --retry-delay 1 "$@"; }

          get http://127.0.0.1:3000/ | grep -q 'Find the angle'
          get http://127.0.0.1:3000/pricing | grep -q '7-Day Test Drive'
          get http://127.0.0.1:3000/studio | grep -q 'Run social from one command'
          get http://127.0.0.1:3000/studio/create | grep -q 'Build ad plan'
          get http://127.0.0.1:3000/studio/library | grep -q 'Everything you have made'
          get http://127.0.0.1:3000/studio/moodboards | grep -q 'Teach the studio what good looks like'
          get http://127.0.0.1:3000/studio/canvas | grep -q 'Build the creative flow visually'
          get http://127.0.0.1:3000/studio/campaigns | grep -q 'Give the agent an outcome'
          get http://127.0.0.1:3000/studio/calendar | grep -q 'See what goes live before it does'
          get http://127.0.0.1:3000/studio/analytics | grep -q 'No performance evidence yet'
          get http://127.0.0.1:3000/studio/settings | grep -q 'Connect the engines'
          get http://127.0.0.1:3000/admin | grep -q 'Opening console'
          get http://127.0.0.1:3000/admin/dashboard | grep -q 'Dashboard'

          INVALID_OFFER_STATUS=$(curl -sS --retry 5 --retry-connrefused --retry-delay 1 -o /tmp/invalid-offer.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/checkout/offer -H 'Content-Type: application/json' --data '{"offer":"not-a-real-offer"}')
          test "$INVALID_OFFER_STATUS" = "400"
          grep -q 'Unknown offer' /tmp/invalid-offer.json

          CHECKOUT_STATUS=$(curl -sS --retry 5 --retry-connrefused --retry-delay 1 -o /tmp/checkout.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/checkout/offer -H 'Content-Type: application/json' --data '{"offer":"trial-7"}')
          test "$CHECKOUT_STATUS" = "503"
          grep -q 'not configured' /tmp/checkout.json

          ACTIVATE_STATUS=$(curl -sS --retry 5 --retry-connrefused --retry-delay 1 -o /tmp/activate.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/trial/activate -H 'Content-Type: application/json' --data '{"session_id":"invalid"}')
          test "$ACTIVATE_STATUS" = "400"
          grep -q 'Invalid checkout session' /tmp/activate.json

          TRIAL_STATUS=$(curl -sS --retry 5 --retry-connrefused --retry-delay 1 -o /tmp/trial-status.json -w '%{http_code}' http://127.0.0.1:3000/api/trial/status)
          test "$TRIAL_STATUS" = "401"

          EXECUTE_STATUS=$(curl -sS --retry 5 --retry-connrefused --retry-delay 1 -o /tmp/trial-execute.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/trial/execute -H 'Content-Type: application/json' --data '{}')
          test "$EXECUTE_STATUS" = "401"

          RESPONSE=$(get -X POST http://127.0.0.1:3000/v1/discover -H 'Content-Type: application/json' --data '{"intent":"cinematic launch reel for my clothing brand","limit":3}')
          echo "$RESPONSE" | grep -q '"count":3'
          echo "$RESPONSE" | grep -q 'bb-video-launch-reel-001'
          GROWTH=$(get -X POST http://127.0.0.1:3000/v1/discover -H 'Content-Type: application/json' --data '{"intent":"travel lifestyle selfie portrait photography","limit":3}')
          echo "$GROWTH" | grep -q '"count":3'
          echo "$GROWTH" | grep -q 'ym-gpt2-lifestyle-selfie-001'
          get http://127.0.0.1:3000/v1/cards/ym-gpt2-lifestyle-selfie-001 | grep -q 'CC-BY-4.0'
          ADAPTED=$(get -X POST http://127.0.0.1:3000/v1/adapt -H 'Content-Type: application/json' --data '{"card_id":"ym-gpt2-lifestyle-selfie-001","inputs":{"subject":"a ceramic artist","location":"Puerto Vallarta","time_of_day":"golden hour"}}')
          echo "$ADAPTED" | grep -q 'Puerto Vallarta'
          get -D /tmp/agent-pack.headers -o /tmp/agent-pack.zip -X POST http://127.0.0.1:3000/v1/export/icm -H 'Content-Type: application/json' --data '{"card_id":"ym-gpt2-lifestyle-selfie-001","inputs":{"subject":"a ceramic artist","location":"Puerto Vallarta","time_of_day":"golden hour"}}'
          grep -qi '^content-type: application/zip' /tmp/agent-pack.headers
          grep -qi '^x-buffer-blaster-sha256:' /tmp/agent-pack.headers
          unzip -t /tmp/agent-pack.zip >/dev/null
