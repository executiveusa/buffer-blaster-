name: Test API and Frontend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    name: Python API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Run Python tests
        run: python -m pytest tests -q
      - name: Compile verified creator corpus
        run: python scripts/build_creator_catalog.py --input library/imported/youmind --output /tmp/creator-catalog

  frontend-build:
    name: Frontend security, gauntlet, lint, build, and route smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Block high-severity production vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Block critical vulnerabilities in full tree
        run: npm audit --audit-level=critical
      - name: Test dependency-free frontmatter parser
        run: npm run test:frontmatter
      - name: Run structural design gauntlet
        run: npm run gauntlet
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build > /tmp/frontend-build.log 2>&1
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-diagnostics
          path: /tmp/frontend-build.log
      - name: Smoke public, studio, legacy creator, and export routes
        run: |
          npm run start -- -p 3000 > /tmp/social-studio-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ | grep -q 'Make the content'
          curl -fsS http://127.0.0.1:3000/pricing | grep -q 'Pay for the system'
          curl -fsS http://127.0.0.1:3000/studio | grep -q 'Run social from one command'
          curl -fsS http://127.0.0.1:3000/studio/create | grep -q 'Turn a product into an ad'
          curl -fsS http://127.0.0.1:3000/studio/library | grep -q 'Everything you have made'
          curl -fsS http://127.0.0.1:3000/studio/moodboards | grep -q 'Teach the studio what good looks like'
          curl -fsS http://127.0.0.1:3000/studio/canvas | grep -q 'Build the creative flow visually'
          curl -fsS http://127.0.0.1:3000/studio/campaigns | grep -q 'Give the agent an outcome'
          curl -fsS http://127.0.0.1:3000/studio/calendar | grep -q 'See what goes live before it does'
          curl -fsS http://127.0.0.1:3000/studio/analytics | grep -q 'Make the next campaign from what worked'
          curl -fsS http://127.0.0.1:3000/studio/settings | grep -q 'Connect the engines'
          curl -fsS http://127.0.0.1:3000/founding | grep -q 'Founding Creator'
          curl -fsS http://127.0.0.1:3000/admin | grep -q 'Opening console'
          curl -fsS http://127.0.0.1:3000/admin/dashboard | grep -q 'Dashboard'
          CHECKOUT_STATUS=$(curl -sS -o /tmp/checkout.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/checkout/founding)
          test "$CHECKOUT_STATUS" = "503"
          grep -q 'not configured' /tmp/checkout.json
          RESPONSE=$(curl -fsS -X POST http://127.0.0.1:3000/v1/discover -H 'Content-Type: application/json' --data '{"intent":"cinematic launch reel for my clothing brand","limit":3}')
          echo "$RESPONSE" | grep -q '"count":3'
          echo "$RESPONSE" | grep -q 'bb-video-launch-reel-001'
          GROWTH=$(curl -fsS -X POST http://127.0.0.1:3000/v1/discover -H 'Content-Type: application/json' --data '{"intent":"travel lifestyle selfie portrait photography","limit":3}')
          echo "$GROWTH" | grep -q 'ym-gpt2-lifestyle-selfie-001'
          curl -fsS http://127.0.0.1:3000/v1/cards/ym-gpt2-lifestyle-selfie-001 | grep -q 'CC-BY-4.0'
          ADAPTED=$(curl -fsS -X POST http://127.0.0.1:3000/v1/adapt -H 'Content-Type: application/json' --data '{"card_id":"ym-gpt2-lifestyle-selfie-001","inputs":{"subject":"a ceramic artist","location":"Puerto Vallarta","time_of_day":"golden hour"}}')
          echo "$ADAPTED" | grep -q 'Puerto Vallarta'
          curl -fsS -D /tmp/agent-pack.headers -o /tmp/agent-pack.zip -X POST http://127.0.0.1:3000/v1/export/icm -H 'Content-Type: application/json' --data '{"card_id":"ym-gpt2-lifestyle-selfie-001","inputs":{"subject":"a ceramic artist","location":"Puerto Vallarta","time_of_day":"golden hour"}}'
          grep -qi '^content-type: application/zip' /tmp/agent-pack.headers
          grep -qi '^x-buffer-blaster-sha256:' /tmp/agent-pack.headers
          unzip -t /tmp/agent-pack.zip >/dev/null
