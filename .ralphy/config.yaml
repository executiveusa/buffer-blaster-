project:
  name: Buffer Blaster
  language: Python/TypeScript
  framework: FastAPI/Next.js

commands:
  test: "python -m pytest tests -q"
  lint: "cd frontend && npm run lint"
  build: "cd frontend && npm run build"

rules:
  - "Read AGENTS.md, CONTEXT.md and EMERALD_TABLETS.md before changing code."
  - "Read docs/AUTONOMOUS_FINISH_LOOP.md and work only on the currently supplied docs/autonomous/phase-*.md PRD. Do not jump ahead or invent unrelated features."
  - "Use the installed Unlazy skill: acceptance tasks are evidence ledgers, not prose checkboxes. Do not mark a task complete until its observable outcome is verified."
  - "Use the smallest necessary change: reuse repository code, stdlib, native platform features, and installed dependencies before adding abstractions."
  - "Study referenced open-source repos for patterns first. Do not copy source code unless license compatibility and provenance are explicitly recorded."
  - "Never weaken auth, RLS, validation, accessibility, observability, rollback, approval, spend, tenant isolation, or publish guards to reduce code."
  - "Never print or commit secrets."
  - "Real paid generation, ad activation, publishing, destructive data operations, or contractual commitments require the existing explicit human approval control and any required concrete budget ceiling."
  - "Browser or remote agents may request capabilities and plans but may not increase server-owned wallet or budget authority."
  - "Every task completion requires executable evidence; rerun affected tests after changes."
  - "A provider/credential blocker does not stop independent repo, runtime, UX, ICM, docs, security or interface work."
  - "Final visual/product review uses a fresh independent Gauntlet critic: AdPanel for clarity/product presentation and the repository Collins protocol for identity, restraint, typography and mobile craft. Binary ours/reference choice, never self-scoring."

boundaries:
  never_touch:
    - ".env*"
    - "**/*.pem"
    - "**/*.key"
    - "**/secrets/**"
    - ".git/**"
    - ".ralphy/progress.txt"

capabilities:
  browser: "auto"
