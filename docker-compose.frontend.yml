# Self-hosted frontend for Buffer Blaster (Next.js standalone).
# Run merged with the API stack, from the repo root:
#   docker compose -f docker-compose.prod.yml -f docker-compose.frontend.yml up -d frontend
# The frontend talks to the API in-cluster via BLASTER_API_URL and is published
# on loopback only; Caddy terminates TLS and proxies bufferblaster.* / buffer-blaster.*.
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CONSOLE_OPEN: "${NEXT_PUBLIC_CONSOLE_OPEN:-false}"
    environment:
      BLASTER_API_URL: "http://api:8000"
      NEXT_TELEMETRY_DISABLED: "1"
      CONSOLE_OPEN: "${CONSOLE_OPEN:-false}"
      BLASTER_OPERATOR_PASSWORD: "${BLASTER_OPERATOR_PASSWORD:-}"
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8099:3000"
    networks:
      - default
      - selfhost_supabase
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
